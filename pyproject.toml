[project]
name = "pyaging"
description = "A Python-based compendium of GPU-optimized aging clocks."
authors = [
    {name = "Lucas Paulo de Lima Camillo", email = "lucas_camillo@alumni.brown.edu"}
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
keywords = [
    "aging",
    "epigenetics",
    "aging-clocks",
    "methylation",
    "biomarkers",
    "bioinformatics",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "scikit-learn>=1.3.2",
    "pandas>=2.2.0",
    "torch>=2.2.0",
    "numpy>=2.0.0",
    "anndata>=0.10.3",
    "huggingface-hub>=1.3,<2",
]

[project.urls]
homepage = "https://github.com/lucascamillomd/pyaging"
repository = "https://github.com/lucascamillomd/pyaging"

[project.optional-dependencies]
histone = ["pyBigWig>=0.3.23"]

[dependency-groups]
test = [
    "pytest>=7.2.0",
    "nbmake>=1.4.6",
    "pytest-cov",
    "pyyaml",
    "pyBigWig>=0.3.23",
    "hatchling>=1.27",
]
docs = [
    "sphinx>=7.1.2",
    "pydata-sphinx-theme>=0.15.4",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx-issues",
    "sphinx-design",
    "scanpydoc",
    "myst-parser",
    "nbsphinx",
    "ipython",
    "pygments",
]
notebooks = [
    "ipykernel",
    "marimo[recommended]",
    "matplotlib",
    "polars",
    "openai",
    "pyarrow",
    "plotly",
]
lint = [
    "ruff>=0.14.6",
    "pre-commit>=4.3.0",
]
dev = [
    {include-group = "test"},
    {include-group = "docs"},
    {include-group = "notebooks"},
    {include-group = "lint"},
]

[tool.hatch.version]
path = "src/pyaging/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyaging"]

[tool.hatch.build.targets.sdist]
only-include = ["src/pyaging", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 120
extend-exclude = ["*.ipynb", "dev"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "7"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib -m 'not full_catalog and not online'"
xfail_strict = true
markers = [
    "full_catalog: downloads and validates the complete clock catalog (~25 GiB)",
    "online: accesses public remote services",
]

[tool.coverage.run]
source = ["pyaging"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
